name: macOS sürümü

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Sürüm numarasını hazırla
        id: version
        shell: bash
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          npm version "$VERSION" --no-git-tag-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=build-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: macOS araçlarını hazırla
        run: npm run fetch-binaries -- mac-x64

      - name: DMG oluştur
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac

      - name: DMG dosyasını bul
        id: dmg
        shell: bash
        run: |
          FILE="$(find release -maxdepth 1 -name 'Scryno-*.dmg' -type f | sort | tail -1)"
          test -n "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: GitHub Release yayınla
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          FILE: ${{ steps.dmg.outputs.file }}
        shell: bash
        run: |
          gh release create "$TAG" "$FILE" \
            --title "Scryno $VERSION" \
            --target "$GITHUB_SHA" \
            --latest \
            --notes "main dalındaki $GITHUB_SHA commit'i için otomatik macOS Intel sürümü. Apple Silicon Mac'lerde Rosetta ile çalışır."
