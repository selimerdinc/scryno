name: macOS sürümü

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Tip kontrolü
        run: npm run typecheck

      - name: Sürüm numarasını hazırla
        id: version
        shell: bash
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          npm version "$VERSION" --no-git-tag-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=build-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: macOS araçlarını hazırla
        shell: bash
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            npm run fetch-binaries -- mac-arm64
          else
            npm run fetch-binaries -- mac-x64
          fi

      - name: DMG oluştur
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac

      - name: DMG dosyasını bul
        id: dmg
        shell: bash
        run: |
          FILE="$(find release -maxdepth 1 -name 'Scryno-*.dmg' -type f | sort | tail -1)"
          test -n "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Homebrew Cask dosyasını güncelle
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          node scripts/generate-cask.mjs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/scryno.rb
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cask): update scryno.rb to v$VERSION [skip ci]" && git push origin main)

      - name: GitHub Release yayınla
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          FILE: ${{ steps.dmg.outputs.file }}
        shell: bash
        run: |
          cat << EOF > release_notes.md
          ## Scryno v${VERSION}

          ### Homebrew ile Kurulum:
          \`\`\`bash
          brew tap selimerdinc/scryno https://github.com/selimerdinc/scryno
          brew install --cask scryno
          \`\`\`

          ### Güncelleme:
          \`\`\`bash
          brew upgrade --cask scryno
          \`\`\`
          EOF

          gh release create "$TAG" "$FILE" Casks/scryno.rb \
            --title "Scryno $VERSION" \
            --target "$GITHUB_SHA" \
            --latest \
            --notes-file release_notes.md
